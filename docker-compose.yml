services:
  mysql:
    image: mysql:8.4.2
    container_name: oxygen_admin_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-oxygen_admin}
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - oxygen_admin_mysql_data:/var/lib/mysql

volumes:
  oxygen_admin_mysql_data:
